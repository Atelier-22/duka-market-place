<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!--
    The Duka tab icon. Solid brand green rather than currentColor: a favicon is
    rendered outside the page, so it has no colour to inherit.

    No background plate — the mark sits on whatever the browser's tab strip is,
    and this green holds up against both the light and dark ones.
  -->
  <g stroke="#1B5E3A" fill="#1B5E3A">
    <path d="M63 13 v-2 a7 7 0 0 1 14 0 v2" fill="none" stroke-width="4" stroke-linecap="round"/>
    <path d="M58.5 14 h23 a2.5 2.5 0 0 1 2.5 2.8 l-1.8 14a3.5 3.5 0 0 1-3.5 3.2 h-17.4 a3.5 3.5 0 0 1-3.5-3.2 l-1.8-14 A2.5 2.5 0 0 1 58.5 14 Z" stroke="none"/>
    <circle cx="42" cy="60" r="28" fill="none" stroke-width="10"/>
    <path d="M70 36 v24" fill="none" stroke-width="10" stroke-linecap="round"/>
    <path d="M27.9 65.1 A 15 15 0 1 1 56.1 65.1" fill="none" stroke-width="7" stroke-linecap="round"/>
    <path d="M42 76 C 36 67.5 33.5 61.5 33.5 56.5 A 8.5 8.5 0 1 1 50.5 56.5 C 50.5 61.5 48 67.5 42 76 Z" fill="none" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="42" cy="55.5" r="3.6" stroke="none"/>
  </g>
</svg>
